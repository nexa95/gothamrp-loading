<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>1980s Gotham Roleplay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root { --img: url("cover.jpg"); }
  html, body { margin: 0; height: 100%; background: #07080a; overflow: hidden; }
  body { color: #e9e2d2; font-family: "Special Elite", "Courier New", monospace; }
  .fill { position: fixed; inset: -40px; background: var(--img) center / cover no-repeat; filter: blur(28px) brightness(.35) saturate(.8); }
  .art { position: fixed; top: 0; bottom: 0; left: 50%; transform: translateX(-50%); height: 100%; width: 65.9vh;
         background: var(--img) center / contain no-repeat; box-shadow: 0 0 80px 30px rgba(0,0,0,.65); }
  .shade { position: fixed; inset: 0; background: linear-gradient(to top, rgba(4,5,7,.92) 0%, rgba(4,5,7,.55) 22%, rgba(4,5,7,0) 45%); }
  .title { position: fixed; left: 0; right: 0; bottom: 9vh; text-align: center; }
  .title h1 { margin: 0; font-family: "Oswald", sans-serif; font-weight: 600; font-size: 6.2vh; letter-spacing: .32em;
              text-transform: uppercase; text-indent: .32em; color: #efe8d8; text-shadow: 0 2px 18px rgba(0,0,0,.9); }
  .title h2 { margin: .6vh 0 0; font-family: "Oswald", sans-serif; font-weight: 500; font-size: 2.1vh; letter-spacing: .55em;
              text-indent: .55em; text-transform: uppercase; color: #b9afa0; }
  .rule { width: 18vh; height: 1px; margin: 1.6vh auto; background: #8a2a22; }
  .status { position: fixed; left: 0; right: 0; bottom: 3.2vh; text-align: center; font-size: 1.6vh; color: #9d9586; letter-spacing: .08em; }
  .bar { width: 34vh; height: 2px; margin: 1vh auto 0; background: rgba(255,255,255,.12); }
  .bar i { display: block; height: 100%; width: 0; background: #c9c0ad; transition: width .4s; }
</style>
</head>
<body>
  <div class="fill"></div>
  <div class="art"></div>
  <div class="shade"></div>
  <div class="title">
    <h1>Gotham City</h1>
    <div class="rule"></div>
    <h2>1980s Roleplay</h2>
  </div>
  <div class="status"><span id="st">Connecting…</span><div class="bar"><i id="bar"></i></div></div>
<script>
  var total = 0, needed = 0;
  function setText(t) { document.getElementById("st").textContent = t; }
  function progress() { if (total > 0) document.getElementById("bar").style.width = Math.max(0, Math.min(100, (1 - needed / total) * 100)) + "%"; }
  // Garry's Mod calls these while you join
  function GameDetails(server, url, map, maxp, steamid, gamemode) { setText("Arriving in Gotham…"); }
  function SetFilesTotal(t) { total = t; progress(); }
  function SetFilesNeeded(n) { needed = n; progress(); }
  function DownloadingFile(f) { setText("Downloading " + String(f).split("/").pop()); }
  function SetStatusChanged(s) { setText(s); if (/sending client info/i.test(s)) { needed = 0; progress(); } }
</script>
</body>
</html>
